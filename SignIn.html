<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign In | Umar Hamza Muhammad and Sons Enterprise</title>
   
  </head>
  <body>
    <header class="site-header">
      <div class="topbar">
        <a class="brand" href="index.html"><span class="brand-mark">U</span><span>Umar Hamza Muhammad<small>and Sons Enterprise</small></span></a>
      </div>
    </header>
    <main class="main">
      <section class="panel">
        <p class="eyebrow" style="color:#64833a">
          Welcome back
        </p>
        <h1 style="color:var(--green)">
          Sign in to your account
        </h1>
        <p>
          Enter your email and password to continue.
        </p>
        <form action="#" method="get">
          <div class="field">
            <label for="email">
              Email address
            </label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="password">
              Password
            </label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div class="form-actions">
            <button class="button" type="submit"> Sign In →</button> <span>New here?<a href="SignUp.html">Create an account</a></span>
          </div>
        </form>
        
      </section>
    </main>
    <footer class="footer">
      <p>
        © 2026 <strong>Umar Hamza Muhammad and Sons Enterprise</strong> · Serving our community since 2008
      </p>
    </footer>
  </body>
</html>
 <style>
      :root {
        --green: #173f35;
        --green-2: #245a49;
        --lime: #b6d66a;
        --cream: #f7f5ed;
        --ink: #20332d;
        --muted: #66756e;
        --white: #fff;
        --line: #e5e9df;
        --gold: #e8b94f;
        --shadow: 0 18px 48px rgba(23,63,53,.10);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
        line-height: 1.65;
      }
      a {
        color: var(--green-2);
      }
      a:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 4px;
      }
      .site-header {
        background: var(--green);
        color: white;
      }
      .topbar {
        max-width: 1160px;
        margin: auto;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: white;
        text-decoration: none;
        font-weight: 750;
        line-height: 1.2;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: var(--lime);
        color: var(--green);
        font-weight: 900;
        font-size: 20px;
      }
      .brand small {
        display: block;
        margin-top: 4px;
        color: #c8d7ce;
        font-weight: 500;
        font-size: 11px;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .nav {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .nav a {
        padding: 9px 13px;
        border-radius: 999px;
        color: #e5eee8;
        text-decoration: none;
        font-size: 14px;
        font-weight: 650;
      }
      .nav a:hover,.nav a[aria-current=page] {
        background: rgba(255,255,255,.13);
        color: white;
      }
      .hero {
        position: relative;
        overflow: hidden;
        background: radial-gradient(ellipse at 84% 15%,rgba(182,214,106,.27),transparent 28%),linear-gradient(125deg,#173f35 8%,#245a49 70%,#32715a);
        color: white;
      }
      .hero-inner {
        max-width: 1160px;
        margin: auto;
        padding: 72px 24px 78px;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 16px;
        color: var(--lime);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .15em;
        text-transform: uppercase;
      }
      .eyebrow:before {
        content: "";
        width: 24px;
        height: 2px;
        background: currentColor;
      }
      .hero h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(38px,7vw,68px);
        line-height: 1.04;
        letter-spacing: -.045em;
      }
      .hero p {
        max-width: 610px;
        margin: 20px 0 0;
        color: #e0ebe4;
        font-size: 18px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 19px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: var(--lime);
        color: var(--green);
        text-decoration: none;
        font-weight: 800;
        transition: transform .2s,background .2s;
      }
      .button:hover {
        transform: translateY(-2px);
        background: #c8e782;
      }
      .button.secondary {
        border-color: rgba(255,255,255,.4);
        background: transparent;
        color: white;
      }
      .button.secondary:hover {
        background: rgba(255,255,255,.1);
      }
      .main {
        width: min(1080px,calc(100% - 40px));
        margin: 54px auto 72px;
      }
      .section-heading {
        margin-bottom: 24px;
      }
      .section-heading h2 {
        margin: 0;
        color: var(--green);
        font-size: clamp(27px,4vw,38px);
        letter-spacing: -.035em;
      }
      .section-heading p {
        max-width: 700px;
        margin: 8px 0 0;
        color: var(--muted);
      }
      .panel {
        padding: clamp(24px,5vw,42px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--white);
        box-shadow: var(--shadow);
      }
      .panel h2,.panel h3 {
        color: var(--green);
      }
      .panel h2 {
        margin-top: 0;
      }
      .panel p {
        color: #52625a;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3,minmax(0,1fr));
        gap: 18px;
      }
      .feature,.product {
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: white;
        box-shadow: 0 8px 28px rgba(23,63,53,.05);
      }
      .feature-icon {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        margin-bottom: 15px;
        border-radius: 15px;
        background: #edf4df;
        font-size: 22px;
      }
      .feature h3,.product h3 {
        margin: 0 0 7px;
        color: var(--green);
      }
      .feature p,.product p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .product {
        overflow: hidden;
        padding: 0;
        transition: transform .2s,box-shadow .2s;
      }
      .product:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow);
      }
      .product img {
        display: block;
        width: 100%;
        height: 210px;
        padding: 14px;
        background: #f4f5ee;
        object-fit: contain;
      }
      .product-copy {
        padding: 18px 20px 22px;
      }
      .tag {
        display: inline-block;
        margin-bottom: 9px;
        padding: 4px 9px;
        border-radius: 999px;
        background: #edf4df;
        color: var(--green-2);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .product h3 {
        font-size: 18px;
      }
      .contact-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 24px 0;
      }
      .contact-item {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fbfcf8;
      }
      .contact-item span {
        display: block;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      .contact-item a {
        font-size: 17px;
        font-weight: 800;
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .note {
        padding: 16px 18px;
        border-left: 4px solid var(--gold);
        border-radius: 0 12px 12px 0;
        background: #fbf5e5;
        color: #5b5038!important;
      }
      .footer {
        padding: 25px 20px;
        background: var(--green);
        color: #d9e6de;
        text-align: center;
        font-size: 13px;
      }
      .footer p {
        margin: 0;
      }
      .footer strong {
        color: white;
      }
      .cta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 30px;
        padding: 24px 28px;
        border-radius: 20px;
        background: #eaf1dc;
      }
      .cta h2 {
        margin: 0;
        color: var(--green);
      }
      .cta p {
        margin: 4px 0 0;
        color: var(--muted);
      }
      .cta .button {
        flex: none;
        background: var(--green);
        color: white;
      }
      .cta .button:hover {
        background: var(--green-2);
      }
      ul {
        padding-left: 22px;
        color: #52625a;
      }
      li {
        padding: 4px 0;
      }
      @media(max-width:760px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .nav {
          flex-wrap: wrap;
          margin-left: -8px;
        }
        .hero-inner {
          padding: 54px 22px 60px;
        }
        .grid {
          grid-template-columns: repeat(2,minmax(0,1fr));
        }
        .main {
          margin-top: 36px;
        }
      }
      @media(max-width:520px) {
        .grid,.contact-grid {
          grid-template-columns: 1fr;
        }
        .nav a {
          padding: 8px 10px;
          font-size: 13px;
        }
        .hero p {
          font-size: 16px;
        }
        .product img {
          height: 220px;
        }
        .cta {
          align-items: flex-start;
          flex-direction: column;
        }
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .field {
        margin: 0 0 16px;
      }
      .field.full {
        grid-column: 1/-1;
      }
      .field label {
        display: block;
        margin-bottom: 6px;
        color: var(--green);
        font-size: 14px;
        font-weight: 750;
      }
      .field input,.field select,.field textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d9e1d8;
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        font: inherit;
      }
      .field input:focus,.field select:focus,.field textarea:focus {
        outline: 3px solid #dbe9b6;
        border-color: var(--green-2);
      }
      .form-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 8px;
      }
      .form-actions .button {
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }
      .form-note {
        margin-top: 20px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #edf4df;
        color: #40533e;
        font-size: 14px;
      }
      .steps {
        counter-reset: step;
      }
      .step {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        margin: 18px 0;
      }
      .step:before {
        counter-increment: step;
        content: counter(step);
        display: grid;
        place-items: center;
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--lime);
        color: var(--green);
        font-weight: 900;
      }
      @media(max-width:520px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .field.full {
          grid-column: auto;
        }
      }
    </style>
